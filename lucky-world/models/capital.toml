# The capital city for the world map: a walled compound with four corner towers,
# a gate, and a domed palace in the middle.
#
# Everything the game recolours per nation is in the assembly "roofs" (tower
# roofs, wing roofs and flags), all in the palette colour "banner". In Duck
# Forge, GlbModel::part("roofs").range() is its triangle range.
version = 0
name = "capital"
description = "Capital city: walled palace compound, about 0.9 x 0.9 and 0.8 tall. The 'roofs' part is in the nation colour 'banner'."

[palette]
banner = "#D0453A"
stone = "#D8CDB8"
stone_dark = "#B3A58C"
wall_top = "#EDE5D4"
paving = "#A89A82"
palace = "#F6EEDC"
gold = "#E8B83A"
wood = "#6E4628"
pole = "#5A4A3A"

[[parts]]
