# A tank for the war map: one model stands for about 1,000 tanks (at least one shows).
# The "hull" part is recoloured in each nation's colour by the game.
version = 0
name = "tank"
description = "Tank, about 0.2 long, 0.12 wide and 0.08 tall, gun pointing front (+z)."

[palette]
hull = "#6B7A4A"
tracks = "#2E2E2A"
turret = "#55613A"
gun = "#2A2A26"

[[parts]]
name = "tracks"
shape = "box"
size = [0.13, 0.03, 0.2]
color = "tracks"
move = [0, 0.015, 0]

[[parts]]
name = "hull"
shape = "box"
size = [0.11, 0.035, 0.18]
color = "hull"
move = [0, 0.045, 0]

[[parts]]
name = "turret"
shape = "cylinder"
radius = 0.035
height = 0.03
segments = 8
color = "turret"
move = [0, 0.077, -0.01]

[[parts]]
name = "gun"
shape = "cylinder"
radius = 0.006
height = 0.11
segments = 6
color = "gun"
move = [0, 0.078, 0.07]
rotate = [90, 0, 0]
