# The stand the wheel turns on: a round stage, a step, a post and an axle.
# The wheel itself is built in code (its slices change every spin).
version = 0
name = "wheel_stand"

[palette]
stage = "#3B2A7A"
trim = "#E0B040"
post = "#2A1F55"
axle = "#F5C542"

[[parts]]
name = "trim"
shape = "cylinder"
radius = 1.3
height = 0.05
segments = 48
color = "trim"

[[parts]]
name = "stage"
shape = "cylinder"
radius = 1.22
height = 0.14
segments = 48
bevel = 0.04
color = "stage"
attach = "bottom"
to = "trim.top"

[[parts]]
name = "step"
shape = "cylinder"
radius = 0.55
height = 0.12
segments = 40
bevel = 0.03
color = "post"
attach = "bottom"
to = "stage.top"

[[parts]]
name = "post"
shape = "box"
size = [0.22, 1.25, 0.22]
taper = 0.7
color = "post"
attach = "bottom"
to = "step.top"

[[parts]]
name = "axle"
shape = "cylinder"
radius = 0.16
height = 0.1
segments = 24
color = "axle"
attach = "bottom"
to = "post.top"
