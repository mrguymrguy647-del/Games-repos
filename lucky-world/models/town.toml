# A small town for the world map: five houses with pitched roofs round a little church.
version = 0
name = "town"
description = "Small town, about 0.6 x 0.6 and 0.35 tall: five houses and a church with a spire."

[palette]
plaster = "#F1E4C8"
plaster_warm = "#E8C99A"
roof_red = "#C4502F"
roof_brown = "#8C5A34"
roof_slate = "#56708F"
stone = "#C9C2B4"
spire = "#3F5878"
chimney = "#8E8174"
leaves = "#4C9E3A"

# A house: plaster walls under a roof. The roof has no colour of its own,
# so each house that uses it gives the roof its colour with `color`.
[define.house]
[[define.house.parts]]
name = "walls"
shape = "box"
size = [0.1, 0.07, 0.08]
color = "plaster"

[[define.house.parts]]
name = "roof"
shape = "prism"
size = [0.112, 0.05, 0.092]
attach = "bottom"
to = "walls.top"

[define.house_warm]
[[define.house_warm.parts]]
name = "walls"
shape = "box"
size = [0.09, 0.06, 0.1]
color = "plaster_warm"

[[define.house_warm.parts]]
name = "roof"
shape = "prism"
size = [0.1, 0.045, 0.112]
attach = "bottom"
to = "walls.top"

[[parts]]
name = "church"
shape = "box"
size = [0.1, 0.09, 0.16]
color = "stone"
move = [0.0, 0.045, -0.153]
sockets = { tower = { on = "front", shift = [0, -1, 0] } }

[[parts]]
name = "church_roof"
shape = "prism"
size = [0.112, 0.06, 0.17]
color = "roof_red"
attach = "bottom"
to = "church.top"

[[parts]]
name = "tower"
shape = "box"
size = [0.062, 0.2, 0.062]
color = "stone"
attach = "foot"
to = "church.tower"
sockets = { foot = { on = "back", shift = [0, -1, 0] } }

[[parts]]
name = "steeple"
shape = "pyramid"
size = [0.074, 0.15, 0.074]
color = "spire"
attach = "bottom"
to = "tower.top"

[[parts]]
name = "house1"
use = "house"
color = "roof_red"
move = [-0.224, 0.035, -0.201]

[[parts]]
name = "house2"
use = "house_warm"
color = "roof_brown"
rotate = [0, 90, 0]
move = [0.224, 0.03, -0.189]

[[parts]]
name = "house3"
use = "house"
color = "roof_slate"
rotate = [0, 90, 0]
move = [-0.236, 0.035, 0.106]

[[parts]]
name = "house4"
use = "house_warm"
color = "roof_red"
move = [0.212, 0.03, 0.142]

[[parts]]
name = "house5"
use = "house"
color = "roof_brown"
move = [-0.024, 0.035, 0.224]

[[parts]]
name = "chimney1"
shape = "box"
size = [0.016, 0.04, 0.016]
color = "chimney"
move = [-0.254, 0.115, -0.177]

[[parts]]
name = "chimney2"
shape = "box"
size = [0.016, 0.04, 0.016]
color = "chimney"
move = [-0.047, 0.115, 0.248]

[[parts]]
name = "tree1"
shape = "cone"
radius = 0.035
height = 0.11
segments = 6
color = "leaves"
move = [0.071, 0.055, 0.047]

[[parts]]
name = "tree2"
shape = "cone"
radius = 0.03
height = 0.09
segments = 6
color = "leaves"
move = [0.118, 0.045, -0.035]
