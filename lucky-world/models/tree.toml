# A round deciduous tree for the world map: a short trunk under a ball crown.
version = 0
name = "tree"
description = "Round leafy tree, 0.32 tall, for forest tiles on the world map."

[palette]
bark = "#7A5232"
leaves = "#4FA83D"

[[parts]]
name = "trunk"
shape = "cylinder"
radius = 0.022
height = 0.13
segments = 3
taper = 0.7
color = "bark"
sockets = { crown = { at = [0, 0.035, 0] } }

[[parts]]
name = "crown"
shape = "sphere"
radius = 0.11
segments = 8
color = "leaves"
attach = "bottom"
to = "trunk.crown"
