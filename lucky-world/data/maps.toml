# LUCKY WORLD: the three premade maps.
#
# The Continent wheel is made from the chosen map's continents, so every map
# can have its own. Tags on a continent are what the other wheels' rules look
# at (see wheels.toml):
#
#   island     - the continent is an island (or islands): nobody there is landlocked
#   heartland  - deep inland: landlocked countries are more likely
#   cold, temperate, hot, arid, tropical - climate, for Land type and Resource
#   rich, poor - nudges HDI
#
# `islands = true` on a map gives every one of its continents the `island` tag.
# `rivals` is how many NPC nations spin their wheels right after the player.
#   More nations are then made to fill the empty land, up to max_nations in
#   data/world.toml.
# Each map's terrain is data/maps/<id>.txt, and its provinces, rivers and
#   landmarks are data/maps/<id>.toml.
# `style` picks the name syllables in names.toml.
# `weight` is how often the Continent wheel lands there (bigger = more often).

[[map]]
id = "grand"
name = "The Grand Continent"
description = "One vast landmass. Long borders, few coasts, many neighbours."
rivals = 9

  [[map.continent]]
  id = "northern_wilds"
  label = "Northern Wilds"
  weight = 18
  tags = ["cold"]
  style = "north"

  [[map.continent]]
  id = "heartland"
  label = "The Heartland"
  weight = 24
  tags = ["temperate", "heartland", "rich"]
  style = "middle"

  [[map.continent]]
  id = "eastern_steppe"
  label = "Eastern Steppe"
  weight = 20
  tags = ["arid", "heartland"]
  style = "east"

  [[map.continent]]
  id = "sunward_coast"
  label = "Sunward Coast"
  weight = 18
  tags = ["hot", "arid"]
  style = "sun"

  [[map.continent]]
  id = "green_south"
  label = "Green South"
  weight = 20
  tags = ["tropical", "poor"]
  style = "south"

[[map]]
