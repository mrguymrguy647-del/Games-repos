[missions]                     # [9] ease, exposure, days
# With an even match (skill = the target's counter-intel), k = 6:
#   success: intel 55%, fund 50%, unrest 40%, sabotage 35%, meddle 30%,
#            steal 25%, bribe 15%, revolt 10%, kill 8%
#   caught:  intel 15%, fund 20%, steal 25%, unrest 25%, sabotage 30%,
#            meddle 30%, bribe 35%, revolt 40%, kill 50%
