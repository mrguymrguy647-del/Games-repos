# tier      raw, refined or final
# price     the world price at the start, in world dollars (W$) per unit
# weight    how much transport capacity one unit takes (0: moves on the grid)
# spoil     the share of the stock that goes bad each day
# trade     false: can't be traded between nations (electricity)
# military  goes to the national stockpile for war (docs/WAR.md, section 1)

