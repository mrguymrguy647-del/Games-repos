# LUCKY WORLD: buildings (see docs/ECONOMY.md, section 3).
#
# sector       farming, mining or industry (who works there)
# output       the good it makes; amount = units per level per day at tech 1
#              (amounts are balanced so every building needs about the same
#              labour per W$ of value added at base prices: about 0.031
#              workers per W$ a day, so no chain is born losing money)
# inputs       units of each input per unit of output
# deposit      raw buildings need a deposit of their output good in the province;
#              cap_per_hex limits their levels: deposit x hexes x cap_per_hex
# skill        the share of skilled workers it needs for full speed
# defect       the share of output scrapped (more with too few skilled workers)
# cost         W$ to build one level (paid in local money), plus build_goods,
#              taking build_days
# upkeep       W$ per level per day while open
# tier         1 raw, 2 power, 3 refined, 4 final: the order they run in a day

