  shift = -0.3

  [[wheel.rule]]
  if = "gdp<1000000000000"
  times = { strongest = 0 }

  # Big armies need people to fill them.
  [[wheel.rule]]
  if = "population<1000000"
  times = { strong = 0, major = 0, strongest = 0 }

  [[wheel.rule]]
  if = "population<3000000"
  times = { strong = 0.3, major = 0 }

  [[wheel.rule]]
  if = "gdp>200000000000"
