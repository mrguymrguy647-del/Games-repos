# LUCKY WORLD: the 16 wheels.
#
# Change anything here and run the game again (no rebuild needed).
# `cargo test` checks this file: every id a rule names must exist, and rules
# may only look at wheels spun *before* theirs.
#
# ---------------------------------------------------------------------------
# How a wheel's odds are worked out, step by step
# ---------------------------------------------------------------------------
# 1. Every option starts at its `weight` (only the ratios matter).
# 2. Every `[[wheel.rule]]` whose `if` is true changes them:
#      times = { landlocked = 0, island = 3 }   multiply those options
#      times = { "#big" = 0.5 }                 multiply every option tagged "big"
#      only  = ["zero"]                         every other option becomes 0
#      shift = 1.0                              move this wheel's `follow` target up
#    `if` is one condition or a list (all must hold). A condition is:
#      "coast=landlocked"           that wheel landed on that option
#      "ideology=democracy|monarchy" ...on any of those
#      "continent#island"           that wheel's option has that tag
#      "population<3000000"         a number wheel's exact value (also >)
#      "army>4"                     a pick wheel's option level (also <)
#      "!coast=landlocked"          not
# 3. Every `[[wheel.follow]]` ties this wheel to earlier ones by `level`:
#      target = shift + sum(from[wheel] * level of that wheel's result)
#      each option's weight *= exp(-0.5 * ((option level - target) / spread)^2)
#    so options near the target are likely and far ones fade away. Smaller
#    `spread` = tighter link. A number wheel with `log = true` has the level
#    log10(value) (1 million people = 6.0, $1 billion = 9.0), so a follow can
#    multiply quantities: GDP = population x money per person.
#    Options with `share` ignore follows: they are a fixed slice of the wheel
#    (e.g. 0.04 = 4%) whenever their rules allow them.
# 4. `unique = "world"` options can only be won by one nation per game;
#    `unique = "continent"` by one nation per continent.
# 5. Options whose chance ends below `min_share` are taken off the wheel.
#    The slices you see on screen are exactly these chances.
#
# Number wheels (`kind = "number"`) land on a band, then roll an exact value
# inside it (log-scale when `log = true`, nearer the follow target).

min_share = 0.015

# How many slices a wheel aims to show: big options are split into several
# slices spread round the wheel (more pegs, more ticks), small ones get one.
slices = 18

# Slice colours, used in turn for options with no `color`. Gold (#ffd23a) is
# kept for rare slices, so it is not in this list.
palette = [
  "#e8505b", "#f9a03f", "#3caea3", "#20639b", "#8e5ac8",
  "#ed6aa6", "#5cc8f0", "#9bd34d", "#b5654a", "#7d8597",
]

[[round]]
number = 1
title = "Land"
tagline = "Where fate puts you on the map"

[[round]]
number = 2
title = "People"
tagline = "Who lives there, and who rules them"

[[round]]
number = 3
title = "Power"
tagline = "Money, muscle and secrets"

[[round]]
number = 4
title = "Fate"
tagline = "The luck of the nation"

# ===========================================================================
# ROUND 1: LAND
# ===========================================================================

[[wheel]]
id = "continent"
round = 1
title = "Continent"
# The options are the chosen map's continents (maps.toml).
source = "map"

# ---------------------------------------------------------------------------
[[wheel]]
id = "size"
round = 1
title = "Country Size"
kind = "number"
unit = "km2"
log = true

  [[wheel.option]]
  id = "tiny"
  label = "Tiny"
  min = 2
  max = 1_000
  weight = 8

  [[wheel.option]]
  id = "small"
  label = "Small"
  min = 1_000
  max = 50_000
  weight = 22

  [[wheel.option]]
  id = "medium"
  label = "Medium"
  min = 50_000
  max = 300_000
  weight = 30

  [[wheel.option]]
  id = "large"
  label = "Large"
  min = 300_000
  max = 1_200_000
  weight = 22

  [[wheel.option]]
  id = "huge"
  label = "Huge"
  min = 1_200_000
  max = 4_000_000
  weight = 12
  tags = ["big"]

  [[wheel.option]]
  id = "colossal"
  label = "Colossal"
  min = 4_000_000
  max = 12_000_000
  weight = 6
  tags = ["big"]

  [[wheel.rule]]
  if = "continent#island"
  times = { tiny = 1.8, huge = 0.35, colossal = 0.1 }

# ---------------------------------------------------------------------------
[[wheel]]
id = "coast"
round = 1
title = "Landlocked or Coastal"

  [[wheel.option]]
  id = "landlocked"
  label = "Landlocked"
  detail = "No coast at all"
  weight = 18

  [[wheel.option]]
  id = "coastal"
  label = "Coastal"
  detail = "A coastline and ports"
  weight = 55
  tags = ["sea"]

  [[wheel.option]]
  id = "peninsula"
  label = "Peninsula"
  detail = "Sea on three sides"
  weight = 15
  tags = ["sea"]

  [[wheel.option]]
  id = "island"
  label = "Island Nation"
  detail = "Sea on every side"
  weight = 12
  tags = ["sea", "island"]

  # The important one: nobody on an island continent is landlocked.
  [[wheel.rule]]
  if = "continent#island"
  times = { landlocked = 0, island = 3.5 }

  [[wheel.rule]]
  if = "continent#heartland"
  times = { landlocked = 2.5, island = 0.15 }

  [[wheel.rule]]
  if = "size=tiny"
  times = { island = 2.5, peninsula = 1.5 }

  [[wheel.rule]]
  if = "size#big"
  times = { island = 0.2, peninsula = 0.5 }

