# ===========================================================================
# ROUND 3: POWER
# ===========================================================================

[[wheel]]
id = "gdp"
round = 3
title = "GDP"
kind = "number"
unit = "usd"
log = true

  # GDP runs from $1 billion to $3 trillion. Every slice has its own luck:
  # `weight` is how lucky that slice is before population and HDI are
  # counted, so the richer the slice, the rarer it is.
  [[wheel.option]]
  id = "g1"
  label = "$1 - 10B"
  min = 1_000_000_000
  max = 10_000_000_000
  weight = 1.0

  [[wheel.option]]
  id = "g2"
  label = "$10 - 50B"
  min = 10_000_000_000
  max = 50_000_000_000
  weight = 1.0

  [[wheel.option]]
  id = "g3"
  label = "$50 - 200B"
  min = 50_000_000_000
  max = 200_000_000_000
  weight = 0.6

  [[wheel.option]]
  id = "g4"
  label = "$200B - 1T"
  min = 200_000_000_000
  max = 1_000_000_000_000
  weight = 0.3

  [[wheel.option]]
  id = "g5"
  label = "$1 - 3T"
  min = 1_000_000_000_000
  max = 3_000_000_000_000
  weight = 0.05

  # The rare golden slice: a small country sitting on a fortune. Its size is
  # per person (like Monaco or Liechtenstein: $100k to $200k a head), so a
  # town of 50,000 isn't handed a $300 billion economy. min/max are what the
  # wheel shows before the population is known.
  [[wheel.option]]
  id = "tiny_rich"
  label = "Tiny but Rich!"
  detail = "A small nation with a fortune"
  min = 80_000_000_000
  max = 600_000_000_000
  per_person = [100_000, 200_000]
  share = 0.04
  color = "#ffd23a"
  tags = ["rare"]

  # GDP = people x money per person (the HDI band's level).
  [[wheel.follow]]
  from = { population = 1.0, hdi = 1.0 }
  shift = 0.0
  spread = 0.28

  [[wheel.rule]]
  if = "population>3000000"
  times = { tiny_rich = 0 }

  [[wheel.rule]]
  if = "ideology=communism|tribalism|colony"
  shift = -0.15

