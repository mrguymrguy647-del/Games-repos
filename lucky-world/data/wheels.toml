  label = "Under 1 million"
  min = 20_000
  max = 1_000_000
  weight = 1

  [[wheel.option]]
  id = "p1"
  label = "1 - 5 million"
  min = 1_000_000
  max = 5_000_000
  weight = 1

  [[wheel.option]]
  id = "p2"
  label = "5 - 20 million"
  min = 5_000_000
  max = 20_000_000
  weight = 1

  [[wheel.option]]
  id = "p3"
  label = "20 - 60 million"
  min = 20_000_000
  max = 60_000_000
  weight = 1

  [[wheel.option]]
  id = "p4"
  label = "60 - 150 million"
  min = 60_000_000
  max = 150_000_000
  weight = 1

  [[wheel.option]]
  id = "p5"
  label = "150 - 400 million"
  min = 150_000_000
  max = 400_000_000
  weight = 1

  [[wheel.option]]
  id = "p6"
  label = "400M - 1.5 billion"
  min = 400_000_000
  max = 1_500_000_000
  weight = 1

  # People = area x people per km2. 10^1.9 = about 80 people per km2.
  [[wheel.follow]]
  from = { size = 1.0 }
  shift = 1.9
  spread = 0.55

  # Harsh land holds fewer people.
  [[wheel.rule]]
  if = "land=desert|tundra"
  shift = -0.6

  [[wheel.rule]]
  if = "land=plains|marsh"
  shift = 0.2

