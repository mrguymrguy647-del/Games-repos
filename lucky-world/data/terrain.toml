# LUCKY WORLD: the terrain letters used in the map grids (data/maps/*.txt).
#
# kind       sea, lake or land. Sea makes a province coastal; a lake doesn't.
# color      the hex's colour on the map.
# height     how high the top of the hex stands (sea level is 0).
# land_type  the Land Type wheel option this terrain counts as, so a nation
#            that rolled "Desert" prefers desert provinces.
# decor      a model from assets/models/ dotted on the hex (optional), and
# decor_count how many (a fraction is a chance: 0.4 = on 4 hexes in 10).

[terrain."~"]
name = "Deep Sea"
kind = "sea"
color = "#1c3c7a"
height = -0.08

[terrain."-"]
name = "Shallow Sea"
kind = "sea"
color = "#2f6fb2"
height = -0.04

[terrain."o"]
name = "Lake"
kind = "lake"
color = "#3f8fd0"
height = -0.02

