[package]
name = "lucky-world"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "LUCKY WORLD: spin for your country, then rule it. Built with Duck Forge."

[features]
# The same three features as Duck Forge. On a server with no screen, build with
# `--no-default-features` and run with `-- --headless`.
default = ["window", "gpu", "audio"]
window = ["duckforge/window", "dep:x11-dl"]
gpu = ["duckforge/gpu"]
audio = ["duckforge/audio"]

[dependencies]
duckforge = { git = "https://github.com/mrguymrguy647-del/Duck-Forge", default-features = false }
png = "0.18"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
bincode = "1.3"
serde_json = "1"
flate2 = "1"

# Fullscreen (Duck Forge has no call for it, ISSUES.md): the game asks the
# window system itself, through the same libraries winit already uses.
[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = { version = "2.21", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
