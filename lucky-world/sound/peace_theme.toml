# World map music in peacetime: calm and sparse. A slow pad moves through
# four chords in F, and now and then one soft bell note sounds. It is
# quiet on purpose: it plays under the sea-and-wind ambience.
# A SEAMLESS LOOP: 5 bars of 4 at 60 BPM = 20.000 s (882,000 samples).
# The pad's long releases and the bell tails ring past the end and are
# folded back onto the start. Bell notes are 6 beats long so their 4 s
# fade is never cut short (a 1-beat default would stop them after 1 s).
version = 0
name = "peace_theme"
description = "Calm, sparse 20 s seamless loop for the world map in peacetime: a slow pad and a few soft bell notes."
tags = ["music", "map", "peace", "loop", "ambient", "calm"]
tempo = 60
beats_per_bar = 4
bars = 5
loop = true
seed = 23
channels = 2

[master]
normalize_lufs = -28

[[effects]]
type = "reverb"
size = 0.8
decay = 3.0
damping = 0.6
mix = 0.3

# ---- instruments ---------------------------------------------------------

# A slow, soft pad: a sine and a triangle, with a filtered saw for warmth.
[instruments.slowpad]
version = 0

[[instruments.slowpad.layers]]
name = "sine"
source = "sine"
volume = 0.45
envelope = { attack = 2.5, decay = 0, sustain = 1, release = 3 }
pitch = { start = 220 }

[[instruments.slowpad.layers]]
name = "triangle"
source = "triangle"
volume = 0.18
envelope = { attack = 3, decay = 0, sustain = 1, release = 3 }
pitch = { start = 220.6 }

[[instruments.slowpad.layers]]
name = "warmth"
source = "saw"
volume = 0.08
envelope = { attack = 3, decay = 0, sustain = 1, release = 3 }
pitch = { start = 219.4 }
filter = { kind = "lowpass", cutoff = 600, resonance = 0.6 }
lfo = { target = "cutoff", rate = 0.15, depth = 0.5 }

# A soft, round bell: slow to fade, no hard edge.
[instruments.softbell]
version = 0

[[instruments.softbell.layers]]
name = "tone"
source = "sine"
volume = 0.6
envelope = { attack = 0.02, decay = 4.0 }
pitch = { start = "C5" }

[[instruments.softbell.layers]]
name = "octave"
source = "sine"
volume = 0.12
envelope = { attack = 0.01, decay = 1.5 }
pitch = { start = "C6" }

[[instruments.softbell.layers]]
name = "partial"
source = "sine"
volume = 0.05
envelope = { attack = 0.005, decay = 0.6 }
pitch = { start = 1443.0 }

# ---- tracks --------------------------------------------------------------

# Fmaj7 (8 beats) | Dm7 | Bbmaj7 | Csus4 (4 beats each). Each chord is held
# a little past the next one so the swells overlap.
[[tracks]]
name = "pad"
instrument = "slowpad"
volume = 0.8
notes = [
  { bar = 1, beat = 0, note = ["F3", "A3", "C4", "E4"], length = 8.5 },
  { bar = 3, beat = 0, note = ["D3", "F3", "A3", "C4"], length = 4.5 },
  { bar = 4, beat = 0, note = ["D3", "F3", "Bb3", "A3"], length = 4.5 },
  { bar = 5, beat = 0, note = ["C3", "F3", "G3", "C4"], length = 4.5 },
]

[[tracks]]
name = "low"
instrument = "slowpad"
volume = 0.9
notes = [
  { bar = 1, beat = 0, note = "F2", length = 8.5 },
  { bar = 3, beat = 0, note = "D2", length = 4.5 },
  { bar = 4, beat = 0, note = "Bb1", length = 4.5 },
  { bar = 5, beat = 0, note = "C2", length = 4.5 },
]

# Five lonely bell notes over 20 seconds.
[[tracks]]
name = "bell"
instrument = "softbell"
volume = 1.3
pan = 0.25
notes = [
  { bar = 1, beat = 2, note = "A4", length = 6 },
  { bar = 2, beat = 3, note = "C5", length = 6, velocity = 0.8 },
  { bar = 3, beat = 2.5, note = "F5", length = 6, velocity = 0.7 },
  { bar = 4, beat = 3, note = "E5", length = 6, velocity = 0.8 },
  { bar = 5, beat = 2, note = "D5", length = 6, velocity = 0.7 },
]
