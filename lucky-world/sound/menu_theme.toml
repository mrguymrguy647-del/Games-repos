# Main menu music: a hopeful, gentle loop. Soft plucks and a few bell
# glints over a warm pad and a quiet round bass, in F major.
# A SEAMLESS LOOP: 8 bars of 4 at 120 BPM = 16.000 s (705,600 samples).
# Whatever rings past the end (pad releases, the last plucks, the reverb)
# is folded back onto the start.
# Pluck notes are written 3 beats long: a song note stops its sound when
# it ends, and a 1-beat default would cut the 1.4 s pluck off at 0.5 s.
version = 0
name = "menu_theme"
description = "Hopeful 16 s seamless menu loop: soft plucks and bells over a warm pad, F major."
tags = ["music", "menu", "loop", "calm", "hopeful"]
tempo = 120
beats_per_bar = 4
bars = 8
loop = true
seed = 21
channels = 2

[master]
normalize_lufs = -22

[[effects]]
type = "reverb"
size = 0.6
decay = 1.8
damping = 0.5
mix = 0.22

# ---- instruments ---------------------------------------------------------

# A soft plucked string: a sine body, an octave shimmer and a faint
# bell-like partial, all fading on their own.
[instruments.pluck]
version = 0

[[instruments.pluck.layers]]
name = "body"
source = "sine"
volume = 0.8
envelope = { attack = 0.004, decay = 1.4 }
pitch = { start = "C4" }

[[instruments.pluck.layers]]
name = "octave"
source = "triangle"
volume = 0.22
envelope = { attack = 0.002, decay = 0.45 }
pitch = { start = "C5" }

[[instruments.pluck.layers]]
name = "partial"
source = "sine"
volume = 0.06
envelope = { attack = 0.001, decay = 0.2 }
pitch = { start = 721.0 }

# A small glassy bell for the high glints.
[instruments.bell]
version = 0

[[instruments.bell.layers]]
name = "strike"
source = "sine"
volume = 0.6
envelope = { attack = 0.002, decay = 2.2 }
pitch = { start = "C6" }

[[instruments.bell.layers]]
name = "partial"
source = "sine"
volume = 0.18
envelope = { attack = 0.001, decay = 0.7 }
pitch = { start = 2887.0 }

# A warm pad: two slightly detuned saws through a soft low-pass and a sine.
[instruments.warm]
version = 0

[[instruments.warm.layers]]
name = "saw a"
source = "saw"
volume = 0.22
envelope = { attack = 0.7, decay = 0.3, sustain = 0.8, release = 1.6 }
pitch = { start = 261.0 }
filter = { kind = "lowpass", cutoff = 900, resonance = 0.6 }

[[instruments.warm.layers]]
name = "saw b"
source = "saw"
volume = 0.22
envelope = { attack = 0.7, decay = 0.3, sustain = 0.8, release = 1.6 }
pitch = { start = 262.4 }
filter = { kind = "lowpass", cutoff = 900, resonance = 0.6 }

[[instruments.warm.layers]]
name = "sine"
source = "sine"
volume = 0.3
envelope = { attack = 0.7, decay = 0.3, sustain = 0.8, release = 1.6 }
pitch = { start = 261.0 }

# A round, quiet bass.
[instruments.softbass]
version = 0

[[instruments.softbass.layers]]
name = "round"
source = "triangle"
volume = 0.7
envelope = { attack = 0.01, decay = 1.6, sustain = 0.3, release = 0.4 }
pitch = { start = "F2" }

[[instruments.softbass.layers]]
name = "weight"
source = "sine"
volume = 0.5
envelope = { attack = 0.01, decay = 1.2, sustain = 0.3, release = 0.4 }
pitch = { start = "F2" }

# ---- tracks --------------------------------------------------------------

# F | C | Dm | Bb | F | C | Bb | C (the last bar leads back to the first).
[[tracks]]
name = "pad"
instrument = "warm"
volume = 0.8
notes = [
  { bar = 1, beat = 0, note = ["F3", "A3", "C4"], length = 4 },
  { bar = 2, beat = 0, note = ["E3", "G3", "C4"], length = 4 },
